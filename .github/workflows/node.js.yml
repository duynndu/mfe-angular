name: Node.js CI/CD

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'README.md'
      - '/assets/**'
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.19.4]

    steps:
    - uses: actions/checkout@v4

    - name: Set release metadata
      id: release_metadata
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        echo "template_editor_release_tag=template-editor-build-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
        echo "template_editor_zip_name=template-editor-${SHORT_SHA}.zip" >> "$GITHUB_OUTPUT"

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci
    - name: Install template-editor dependencies
      working-directory: ./projects/template-editor
      run: npm ci

    - name: Build template-editor release artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: npm run build:template-editor:shell

    - name: Archive template-editor build
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: |
        cd dist
        zip -r "${{ steps.release_metadata.outputs.template_editor_zip_name }}" template-editor

    - name: Replace environment file with demo version
      working-directory: ./projects/shell
      run: |
        cat src/environments/environment.demo.ts > src/environments/environment.ts
        cat public/federation.manifest.demo.json > public/federation.manifest.json

    - name: Build all projects
      run: npm run build:all:demo

    - name: Copy all built files to deploy folder
      run: |
        mkdir deploy
        mkdir deploy/first-mf
        mkdir deploy/template-editor

        cp -r dist/shell/browser/* deploy/
        cp -r dist/first-mf/browser/* deploy/first-mf/
        cp -r dist/template-editor/* deploy/template-editor/
        touch deploy/.nojekyll

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deploy

    - name: Create template-editor release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_metadata.outputs.template_editor_release_tag }}
        name: Template Editor Build ${{ steps.release_metadata.outputs.template_editor_release_tag }}
        generate_release_notes: true
        files: dist/${{ steps.release_metadata.outputs.template_editor_zip_name }}
